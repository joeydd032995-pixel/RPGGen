<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PromptRealm Software Rasterizer</title>
  <style>
    :root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#090d12;color:#e6edf3}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#192636,#090d12 62%)}
    main{width:min(920px,calc(100% - 32px));display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:24px;align-items:center}
    canvas{width:100%;image-rendering:pixelated;border:1px solid #405268;border-radius:8px;background:#0d1218;box-shadow:0 24px 70px #0009}
    .panel{border-left:3px solid #d4a54f;padding:8px 0 8px 20px}.eyebrow{color:#76b8d7;font-size:.75rem;text-transform:uppercase;letter-spacing:.12em}
    h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(1.8rem,5vw,3.4rem);line-height:.95;margin:.5rem 0 1rem}p{color:#a9b6c5;line-height:1.55}
    label{display:block;margin-top:24px;color:#d4a54f}input{width:100%;accent-color:#d4a54f}.hash{display:flex;justify-content:space-between;margin-top:18px;padding-top:12px;border-top:1px solid #293747;color:#7f91a6}.hash output{color:#e6edf3}
    @media(max-width:720px){main{grid-template-columns:1fr}.panel{border-left:0;border-top:3px solid #d4a54f;padding:20px 0 0}}
  </style>
</head>
<body>
  <main>
    <canvas id="software-canvas" width="320" height="200" aria-label="CPU rasterizer output"></canvas>
    <section class="panel">
      <div class="eyebrow">Clean-room CPU renderer</div>
      <h1>Three paths.<br>One buffer.</h1>
      <p>Flat, HSL Gouraud, textured-plane, alpha, depth buckets, and face priorities rendered deterministically without GPU APIs.</p>
      <label for="frame-slider">Deterministic frame</label>
      <input id="frame-slider" type="range" min="0" max="119" value="0">
      <div class="hash"><span>FNV-1a frame hash</span><output id="frame-hash">--------</output></div>
    </section>
  </main>
  <script type="module" src="/demo/software-renderer/main.mjs"></script>
</body>
</html>
